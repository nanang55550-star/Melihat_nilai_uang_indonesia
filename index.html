<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasarID - IHSG & Kurs Real-Time</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b14;
      --card: #0f1629;
      --card2: #0a0e1c;
      --border: rgba(255,255,255,0.07);
      --muted: #4a5568;
      --up: #10b981;
      --down: #e94560;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Particle canvas */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* Header */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--up);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--up);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    h1.logo {
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    /* Refresh button */
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 6px;
    }

    .refresh-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
    }

    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .spinning { animation: spin 0.8s linear infinite; }

    .auto-note {
      font-size: 11px;
      color: #2d3748;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 40px;
    }

    @media (max-width: 640px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    /* Market Card */
    .market-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .market-card:hover { transform: translateY(-3px); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-up {
      background: rgba(16,185,129,0.12);
      color: var(--up);
      border: 1px solid rgba(16,185,129,0.2);
    }

    .badge-down {
      background: rgba(233,69,96,0.12);
      color: var(--down);
      border: 1px solid rgba(233,69,96,0.2);
    }

    .price {
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 4px;
      transition: all 0.4s ease;
    }

    .price-up { color: var(--up); }
    .price-down { color: var(--down); }

    .change {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    /* Sparkline */
    .sparkline-wrap {
      margin-bottom: 18px;
    }

    /* Stats */
    .stats {
      background: var(--card2);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 12px;
    }

    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--muted); font-weight: 500; }
    .stat-value { color: #cbd5e1; font-weight: 600; }

    .timestamp {
      margin-top: 14px;
      font-size: 11px;
      color: #1e2d40;
    }

    /* Skeleton */
    @keyframes shimmer {
      0% { background-position: -300% 0; }
      100% { background-position: 300% 0; }
    }

    .skeleton {
      border-radius: 6px;
      background: linear-gradient(90deg, #0f1629 25%, #162040 50%, #0f1629 75%);
      background-size: 300% 100%;
      animation: shimmer 1.5s infinite;
    }

    /* Glow */
    .card-up { box-shadow: 0 0 30px rgba(16,185,129,0.08), 0 0 80px rgba(16,185,129,0.03); }
    .card-down { box-shadow: 0 0 30px rgba(233,69,96,0.08), 0 0 80px rgba(233,69,96,0.03); }
    .card-loading { box-shadow: 0 0 30px rgba(96,165,250,0.05); }

    /* Error */
    .error-bar {
      background: rgba(233,69,96,0.08);
      border: 1px solid rgba(233,69,96,0.25);
      border-radius: 14px;
      padding: 14px 20px;
      color: var(--down);
      font-size: 13px;
      text-align: center;
      margin-top: 30px;
      display: none;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 11px;
      color: #1a2535;
    }

    /* Animate in */
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .fade-up { animation: fadeUp 0.5s ease forwards; }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="container">
    <!-- Header -->
    <div style="text-align:center">
      <div class="live-badge">
        <span class="live-dot"></span> Live Data
      </div>
      <h1 class="logo">PasarID</h1>
      <p class="subtitle" id="date-label">Pasar Saham Indonesia Real-Time</p>
      <br>
      <button class="refresh-btn" id="refresh-btn" onclick="refreshAll()">
        <svg id="refresh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        <span id="refresh-label">Perbarui Sekarang</span>
      </button>
      <br>
      <span class="auto-note">Auto-refresh setiap 30 detik</span>
    </div>

    <div class="error-bar" id="error-bar">
      ⚠️ Gagal memuat data dari Yahoo Finance. Mencoba lagi dalam 30 detik…
    </div>

    <!-- Cards -->
    <div class="cards-grid" id="cards-grid">
      <!-- IHSG Card -->
      <div class="market-card card-loading" id="card-ihsg">
        <div class="card-header">
          <div>
            <div class="skeleton" style="height:14px;width:80px;margin-bottom:6px"></div>
            <div class="skeleton" style="height:10px;width:140px"></div>
          </div>
          <div class="skeleton" style="height:28px;width:70px;border-radius:10px"></div>
        </div>
        <div class="skeleton" style="height:38px;width:180px;margin-bottom:8px"></div>
        <div class="skeleton" style="height:13px;width:120px;margin-bottom:18px"></div>
        <div class="skeleton" style="height:48px;width:100%;border-radius:8px;margin-bottom:18px"></div>
        <div style="background:var(--card2);border-radius:14px;padding:14px 16px">
          <div class="skeleton" style="height:12px;width:100%;margin-bottom:8px"></div>
          <div class="skeleton" style="height:12px;width:100%;margin-bottom:8px"></div>
          <div class="skeleton" style="height:12px;width:100%;margin-bottom:8px"></div>
          <div class="skeleton" style="height:12px;width:100%;margin-bottom:8px"></div>
          <div class="skeleton" style="height:12px;width:90%"></div>
        </div>
      </div>

      <!-- USD/IDR Card -->
      <div class="market-card card-loading" id="card-usdidr">
        <div class="card-header">
          <div>
            <div class="skeleton" style="height:14px;width:80px;margin-bottom:6px"></div>
            <div class="skeleton" style="height:10px;width:140px"></div>
          </div>
          <div class="skeleton" style="height:28px;width:70px;border-radius:10px"></div>
        </div>
        <div class="skeleton" style="height:38px;width:200px;margin-bottom:8px"></div>
        <div class="skeleton" style="height:13px;width:120px;margin-bottom:18px"></div>
        <div class="skeleton" style="height:48px;width:100%;border-radius:8px;margin-bottom:18px"></div>
        <div style="background:var(--card2);border-radius:14px;padding:14px 16px">
          <div class="skeleton" style="height:12px;width:100%;margin-bottom:8px"></div>
          <div class="skeleton" style="height:12px;width:100%;margin-bottom:8px"></div>
          <div class="skeleton" style="height:12px;width:100%;margin-bottom:8px"></div>
          <div class="skeleton" style="height:12px;width:90%"></div>
        </div>
      </div>
    </div>

    <footer>
      Data disediakan oleh Yahoo Finance · Hanya untuk referensi · Bukan saran investasi
    </footer>
  </div>

  <script>
    // ─── Date label ───────────────────────────────────────────────
    document.getElementById('date-label').textContent =
      'Pasar Saham Indonesia Real-Time · ' +
      new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    // ─── Particle canvas ─────────────────────────────────────────
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      const COLORS = ['#60a5fa','#a78bfa','#34d399','#818cf8'];
      let particles = [];
      let animId;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      for (let i = 0; i < 55; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          r: Math.random() * 1.5 + 0.4,
          a: Math.random() * 0.35 + 0.08,
          c: COLORS[Math.floor(Math.random() * COLORS.length)]
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of particles) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.c;
          ctx.globalAlpha = p.a;
          ctx.fill();
        }
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i], b = particles[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < 110) {
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.strokeStyle = a.c;
              ctx.globalAlpha = ((110-d)/110) * 0.07;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        ctx.globalAlpha = 1;
        animId = requestAnimationFrame(draw);
      }
      draw();
    })();

    // ─── Format helpers ───────────────────────────────────────────
    function fmt(n, dec=2) {
      return n.toLocaleString('id-ID', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    function fmtVol(v) {
      if (!v) return '—';
      if (v >= 1e9) return (v/1e9).toFixed(2) + 'M';
      if (v >= 1e6) return (v/1e6).toFixed(2) + 'Jt';
      if (v >= 1e3) return (v/1e3).toFixed(1) + 'Rb';
      return v.toLocaleString('id-ID');
    }
    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }

    // ─── Sparkline SVG ────────────────────────────────────────────
    function sparklineSVG(positive) {
      const color = positive ? '#10b981' : '#e94560';
      const pts = positive
        ? [30,28,32,27,35,30,38,33,42,36,45]
        : [45,42,40,43,38,41,35,38,32,36,30];
      const min = Math.min(...pts), max = Math.max(...pts);
      const range = max - min || 1;
      const W = 140, H = 48, p = 4;
      const coords = pts.map((v, i) => {
        const x = p + (i / (pts.length-1)) * (W - p*2);
        const y = p + ((max-v) / range) * (H - p*2);
        return `${x},${y}`;
      }).join(' ');
      const area = `${p},${H-p} ${coords} ${W-p},${H-p}`;
      const gid = `g${positive?1:0}`;
      return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" fill="none">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="${area}" fill="url(#${gid})"/>
        <polyline points="${coords}" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>`;
    }

    // ─── Card renderer ────────────────────────────────────────────
    function renderCard(elId, title, subtitle, data, isIDR) {
      const el = document.getElementById(elId);
      const isUp = data.change >= 0;
      const color = isUp ? '#10b981' : '#e94560';
      const priceStr = isIDR ? `Rp ${fmt(data.price, 0)}` : fmt(data.price, 2);
      const changeStr = (isUp?'+':'') + (isIDR ? fmt(data.change,0) : fmt(data.change,2));
      const pctStr   = (isUp?'+':'') + fmt(data.changePercent, 2) + '%';

      el.className = `market-card ${isUp ? 'card-up' : 'card-down'} fade-up`;

      const prevStr = isIDR ? `Rp ${fmt(data.prev,0)}` : fmt(data.prev,2);
      const openStr = isIDR ? `Rp ${fmt(data.open,0)}` : fmt(data.open,2);
      const highStr = isIDR ? `Rp ${fmt(data.high,0)}` : fmt(data.high,2);
      const lowStr  = isIDR ? `Rp ${fmt(data.low,0)}`  : fmt(data.low,2);

      const volRow = !isIDR
        ? `<div class="stat-row"><span class="stat-label">Volume</span><span class="stat-value">${fmtVol(data.volume)}</span></div>`
        : '';

      el.innerHTML = `
        <div class="card-header">
          <div>
            <div class="card-title">${title}</div>
            <div class="card-sub">${subtitle}</div>
          </div>
          <span class="badge ${isUp?'badge-up':'badge-down'}">${isUp?'▲':'▼'} ${pctStr}</span>
        </div>
        <div class="price ${isUp?'price-up':'price-down'}">${priceStr}</div>
        <div class="change" style="color:${color}">${changeStr} hari ini</div>
        <div class="sparkline-wrap">${sparklineSVG(isUp)}</div>
        <div class="stats">
          <div class="stat-row"><span class="stat-label">Prev. Close</span><span class="stat-value">${prevStr}</span></div>
          <div class="stat-row"><span class="stat-label">Open</span><span class="stat-value">${openStr}</span></div>
          <div class="stat-row"><span class="stat-label">High</span><span class="stat-value">${highStr}</span></div>
          <div class="stat-row"><span class="stat-label">Low</span><span class="stat-value">${lowStr}</span></div>
          ${volRow}
        </div>
        <p class="timestamp">Diperbarui: ${fmtTime(Date.now())}</p>
      `;
    }

    // ─── Yahoo Finance fetch ──────────────────────────────────────
    const PROXY = 'https://query1.finance.yahoo.com/v8/finance/chart/';

    async function fetchQuote(symbol) {
      const url = PROXY + encodeURIComponent(symbol) + '?interval=1d&range=1d';
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const result = json?.chart?.result?.[0];
      if (!result) throw new Error('No data');
      const m = result.meta;
      const price = m.regularMarketPrice ?? m.previousClose;
      const prev  = m.previousClose ?? m.chartPreviousClose;
      const open  = m.regularMarketOpen ?? prev;
      const high  = m.regularMarketDayHigh ?? price;
      const low   = m.regularMarketDayLow  ?? price;
      const volume = m.regularMarketVolume ?? null;
      return { price, prev, open, high, low, volume, change: price-prev, changePercent: prev ? ((price-prev)/prev)*100 : 0 };
    }

    // ─── State ────────────────────────────────────────────────────
    let lastIHSG = null, lastUSDIDR = null, loading = false;

    async function refreshAll() {
      if (loading) return;
      loading = true;
      const btn = document.getElementById('refresh-btn');
      const icon = document.getElementById('refresh-icon');
      const label = document.getElementById('refresh-label');
      btn.disabled = true;
      icon.classList.add('spinning');
      label.textContent = 'Memperbarui...';
      document.getElementById('error-bar').style.display = 'none';

      let hasError = false;

      await Promise.allSettled([
        fetchQuote('^JKSE').then(d => {
          lastIHSG = d;
          renderCard('card-ihsg', 'IHSG', 'Indeks Harga Saham Gabungan · ^JKSE', d, false);
        }).catch(() => {
          hasError = true;
          if (lastIHSG) renderCard('card-ihsg', 'IHSG', 'Indeks Harga Saham Gabungan · ^JKSE', lastIHSG, false);
        }),
        fetchQuote('USDIDR=X').then(d => {
          lastUSDIDR = d;
          renderCard('card-usdidr', 'USD / IDR', 'Kurs Dollar Amerika · USDIDR=X', d, true);
        }).catch(() => {
          hasError = true;
          if (lastUSDIDR) renderCard('card-usdidr', 'USD / IDR', 'Kurs Dollar Amerika · USDIDR=X', lastUSDIDR, true);
        })
      ]);

      if (hasError) document.getElementById('error-bar').style.display = 'block';

      icon.classList.remove('spinning');
      label.textContent = 'Perbarui Sekarang';
      btn.disabled = false;
      loading = false;
    }

    // ─── Boot & auto-refresh ──────────────────────────────────────
    refreshAll();
    setInterval(refreshAll, 30000);
  </script>
</body>
</html>
