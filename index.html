            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);

            -webkit-text-fill-color: transparent;

        .controls-top {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 10px;

        }
        .btn-toggle {
            padding: 8px 32px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid rgba(255, 255, 255, 0.15);

        .main-display {

        .panel {

            width: 100%;

            width: 100%;
            height: 100%;
        }

            text-transform: uppercase;

        }
        .value-main {

            font-weight: 800;

            font-weight: 700;
        }
        .change-abs {
            font-size: 1.1rem;
            color: #aaa;
        }
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            margin: 12px 0;
            border-radius: 2px;
        }
        .rotate-hint {
            position: absolute;
            bottom: 18px;
            left: 50%;

            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.45);

            border: 1px solid rgba(255, 255, 255, 0.1);

        }

                isInteracting[containerId] = false;
            }
        }

        function createAxisLines(scene, dataRange) {
            const axisColor = 0x666666;
            const arrowColor = 0x888888;
            const labelColor = 0xaaaaaa;
            const axisLength = 320;
            const offsetY = -110;

            // X Axis (horizontal - time)
            const xAxisGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-axisLength/2, offsetY, 0),
                new THREE.Vector3(axisLength/2, offsetY, 0)
            ]);
            const xAxisMat = new THREE.LineBasicMaterial({ color: axisColor, linewidth: 1 });
            const xAxis = new THREE.Line(xAxisGeo, xAxisMat);
            scene.add(xAxis);

            // X Axis Arrow
            const xArrowGeo = new THREE.ConeGeometry(2, 6, 4);
            const xArrowMat = new THREE.MeshBasicMaterial({ color: arrowColor });
            const xArrow = new THREE.Mesh(xArrowGeo, xArrowMat);
            xArrow.position.set(axisLength/2 + 3, offsetY, 0);
            xArrow.rotation.z = -Math.PI / 2;
            scene.add(xArrow);

            // Y Axis (vertical - price)
            const yAxisGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-axisLength/2, offsetY, 0),
                new THREE.Vector3(-axisLength/2, offsetY + 220, 0)
            ]);
            const yAxisMat = new THREE.LineBasicMaterial({ color: axisColor });
            const yAxis = new THREE.Line(yAxisGeo, yAxisMat);
            scene.add(yAxis);

            // Y Axis Arrow
            const yArrowGeo = new THREE.ConeGeometry(2, 6, 4);
            const yArrowMat = new THREE.MeshBasicMaterial({ color: arrowColor });
            const yArrow = new THREE.Mesh(yArrowGeo, yArrowMat);
            yArrow.position.set(-axisLength/2, offsetY + 223, 0);
            scene.add(yArrow);

            // Z Axis (depth)
            const zAxisGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-axisLength/2, offsetY, 0),
                new THREE.Vector3(-axisLength/2, offsetY, 80)
            ]);
            const zAxisMat = new THREE.LineBasicMaterial({ color: axisColor });
            const zAxis = new THREE.Line(zAxisGeo, zAxisMat);
            scene.add(zAxis);

            // Z Axis Arrow
            const zArrowGeo = new THREE.ConeGeometry(2, 6, 4);
            const zArrowMat = new THREE.MeshBasicMaterial({ color: arrowColor });
            const zArrow = new THREE.Mesh(zArrowGeo, zArrowMat);
            zArrow.position.set(-axisLength/2, offsetY, 83);
            zArrow.rotation.x = Math.PI / 2;
            scene.add(zArrow);

            // Grid lines on Y axis (horizontal reference lines)
            for (let i = 1; i <= 4; i++) {
                const yPos = offsetY + (220 / 5) * i;
                const gridGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-axisLength/2, yPos, 0),
                    new THREE.Vector3(axisLength/2, yPos, 0)
                ]);
                const gridMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.5 });
                const gridLine = new THREE.Line(gridGeo, gridMat);
                scene.add(gridLine);
            }

            // Grid lines on X axis (vertical reference lines)
            const xSteps = 8;
            for (let i = 1; i < xSteps; i++) {
                const xPos = -axisLength/2 + (axisLength / xSteps) * i;
                const gridGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(xPos, offsetY, 0),
                    new THREE.Vector3(xPos, offsetY + 220, 0)
                ]);
                const gridMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.3 });
                const gridLine = new THREE.Line(gridGeo, gridMat);
                scene.add(gridLine);
            }

            // Axis Labels using simple line-based text approximation
            const labelSprites = [];

            function createTextSprite(text, position, size = 10) {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 128;
                canvas.height = 64;
                context.fillStyle = '#aaaaaa';
                context.font = 'bold 20px Arial';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(text, 64, 32);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.8 });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.position.copy(position);
                sprite.scale.set(size * 1.6, size * 0.8, 1);
                scene.add(sprite);
                return sprite;
            }

            // Y Axis Labels
            createTextSprite('Harga', new THREE.Vector3(-axisLength/2 - 18, offsetY + 230, 0), 12);
            createTextSprite('Waktu', new THREE.Vector3(axisLength/2 + 10, offsetY - 12, 0), 12);
            createTextSprite('Kedalaman', new THREE.Vector3(-axisLength/2 - 18, offsetY, 95), 10);

            return { xAxis, yAxis, zAxis };
        }

        function createCandlestickChart(containerId, data, colorUp, colorDown, scaleFactor = 1) {
            const container = document.getElementById(containerId);
            const width = container.clientWidth;
            const height = container.clientHeight;

            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 10000);
            camera.position.set(0, 150, 400);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            controls.maxPolarAngle = Math.PI / 2;
            controls.minDistance = 200;
            controls.maxDistance = 800;

            const ambientLight = new THREE.AmbientLight(0x404040, 1.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(100, 200, 100);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const pointLight1 = new THREE.PointLight(0x00d4ff, 1, 500);
            pointLight1.position.set(-100, 100, 100);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x7b2cbf, 1, 500);
            pointLight2.position.set(100, 100, -100);
            scene.add(pointLight2);

            let minVal = Infinity, maxVal = -Infinity;
            data.forEach(d => {
                minVal = Math.min(minVal, d.low);
                maxVal = Math.max(maxVal, d.high);
            });

            const range = maxVal - minVal;
            const midVal = (maxVal + minVal) / 2;

            // Create Axis Lines
            createAxisLines(scene, { minVal, maxVal, range });

            const candleGroup = new THREE.Group();
            const spacing = 8;
            const startX = -(data.length * spacing) / 2;

            data.forEach((d, i) => {
                const x = startX + i * spacing;

                const openY = ((d.open - midVal) / range) * 180 * scaleFactor;
                const closeY = ((d.close - midVal) / range) * 180 * scaleFactor;
                const highY = ((d.high - midVal) / range) * 180 * scaleFactor;
                const lowY = ((d.low - midVal) / range) * 180 * scaleFactor;

                const isUp = d.close >= d.open;
                const color = isUp ? colorUp : colorDown;

                const bodyHeight = Math.abs(closeY - openY);
                const bodyMid = (openY + closeY) / 2;
                const bodyGeo = new THREE.BoxGeometry(4, Math.max(bodyHeight, 1.5), 4);
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: 0.6,
                    roughness: 0.3,
                    emissive: color,
                    emissiveIntensity: 0.2
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.set(x, bodyMid, 0);
                body.castShadow = true;
                body.receiveShadow = true;
                candleGroup.add(body);

                const wickHeight = highY - lowY;
                const wickGeo = new THREE.BoxGeometry(1, wickHeight, 1);
                const wickMat = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: 0.8,
                    roughness: 0.2
                });
                const wick = new THREE.Mesh(wickGeo, wickMat);
                wick.position.set(x, (highY + lowY) / 2, 0);
                candleGroup.add(wick);

                const glowGeo = new THREE.BoxGeometry(4.8, Math.max(bodyHeight, 1.5) + 1, 4.8);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.08
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.set(x, bodyMid, 0);
                candleGroup.add(glow);
            });

            scene.add(candleGroup);

            const gridHelper = new THREE.GridHelper(600, 30, 0x444444, 0x222222);
            gridHelper.position.y = -110;
            scene.add(gridHelper);

            const particlesGeo = new THREE.BufferGeometry();
            const particleCount = 150;
            const posArray = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 800;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({
                size: 2,
                color: 0x00d4ff,
                transparent: true,
                opacity: 0.5
            });
            const particles = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particles);

            scenes[containerId] = {
                scene, camera, renderer, controls, candleGroup, particles
            };

            let interactionTimeout;
            isInteracting[containerId] = false;

            controls.addEventListener('start', () => {
                isInteracting[containerId] = true;
                clearTimeout(interactionTimeout);
            });

            controls.addEventListener('end', () => {
                interactionTimeout = setTimeout(() => {
                    isInteracting[containerId] = false;
                }, 3000);
            });

            function animate() {
                animationIds[containerId] = requestAnimationFrame(animate);

                if (!isInteracting[containerId]) {
                    candleGroup.rotation.y += 0.003;
                }

                particles.rotation.y += 0.0008;
                particles.rotation.x += 0.0003;

                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                const newWidth = container.clientWidth;
                const newHeight = container.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            });
        }

        function startAutoRotate(panel) {
            const containerId = 'chart-' + panel;
            if (scenes[containerId]) {
                isInteracting[containerId] = false;
            }
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                createCandlestickChart('chart-ihsg', ihsgData, 0x2ed573, 0xff4757, 1.0);
                createCandlestickChart('chart-usdidr', usdidrData, 0x2ed573, 0xff4757, 1.0);

                window.dispatchEvent(new Event('resize'));
            }, 100);
        });
    </script>
