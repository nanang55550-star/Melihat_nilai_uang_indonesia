<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keadaan Indonesia - IHSG & USD/IDR Real-Time</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        .header {
            text-align: center;
            padding: 15px 10px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 20;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        .main-display {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0;
            transform: scale(0.97) translateY(10px);
            pointer-events: none;
            z-index: 1;
        }
        .panel.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: all;
            z-index: 5;
        }
        .info-section {
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        .chart-section {
            width: 60%;
            height: 100%;
            position: relative;
        }
        .chart-container {
            width: 100%;
            height: 100%;
        }
        .ticker-label {
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .value-main {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
        }
        .value-sub {
            font-size: 1.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .arrow-down {
            color: #ff4757;
        }
        .arrow-up {
            color: #2ed573;
        }
        .change-pct {
            font-size: 2rem;
            font-weight: 700;
        }
        .change-abs {
            font-size: 1.2rem;
            color: #aaa;
        }
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            margin: 15px 0;
            border-radius: 2px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 20;
        }
        .btn-toggle {
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
            color: #888;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }
        .btn-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            transform: translateY(-2px);
        }
        .btn-toggle.active {
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
        }
        .rotate-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* PERBAIKAN TOTAL: CSS Responsif untuk Seluruh Layar HP */
        @media (max-width: 900px) {
            .header h1 {
                font-size: 1.4rem;
                letter-spacing: 4px;
            }
            .panel {
                flex-direction: column;
                /* PENTING: Jaga agar tetap absolute agar sistem tab penumpukan halaman bekerja normal */
                position: absolute; 
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .info-section {
                width: 100%;
                padding: 25px 20px 15px 20px;
                background: rgba(0, 0, 0, 0.2);
                backdrop-filter: none;
                flex-shrink: 0;
            }
            .value-main {
                font-size: 2.2rem;
                margin-bottom: 8px;
            }
            .value-sub {
                font-size: 1.3rem;
            }
            .change-pct {
                font-size: 1.6rem;
            }
            .change-abs {
                font-size: 1rem;
            }
            .divider {
                margin: 10px 0;
            }
            .chart-section {
                width: 100%;
                height: 340px; /* Batasi tinggi konkrit agar WebGL Three.js mengalkulasi resolusi secara pas */
                flex-shrink: 0;
                background: rgba(0,0,0,0.15);
            }
            .controls {
                padding: 12px;
                gap: 10px;
            }
            .btn-toggle {
                padding: 10px 30px;
                font-size: 0.95rem;
            }
            .rotate-hint {
                bottom: 15px;
            }
        }
    </style>
</head>

        let currentScene = 'ihsg';

        // PERBAIKAN: Mengganti variabel global 'event' dengan parameter 'button' langsung agar tidak eror di browser tertentu

        function createCandlestickChart(containerId, data, colorUp, colorDown, scaleFactor = 1) {
            const container = document.getElementById(containerId);
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Scene
            const scene = new THREE.Scene();
            // PERBAIKAN: Menghapus background solid agar transparan mengikuti warna gradien CSS body utama

            // Camera
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 10000);
            camera.position.set(0, 150, 400);

            // PERBAIKAN: Menambahkan alpha: true pada WebGLRenderer agar background transparan
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cegah render berlebih di layar Retina/High-Res
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            controls.maxPolarAngle = Math.PI / 2;
            controls.minDistance = 200;
            controls.maxDistance = 800;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 1.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(100, 200, 100);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024; // Dioptimalkan untuk performa HP agar ramah baterai
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const pointLight1 = new THREE.PointLight(0x00d4ff, 1, 500);
            pointLight1.position.set(-100, 100, 100);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x7b2cbf, 1, 500);
            pointLight2.position.set(100, 100, -100);
            scene.add(pointLight2);

            // Cari nilai min/max
            let minVal = Infinity, maxVal = -Infinity;
            data.forEach(d => {
                minVal = Math.min(minVal, d.low);
                maxVal = Math.max(maxVal, d.high);
            });

            const range = maxVal - minVal;
            const midVal = (maxVal + minVal) / 2;

            // Membuat Candlesticks
            const candleGroup = new THREE.Group();
            const spacing = 8;
            const startX = -(data.length * spacing) / 2;

            data.forEach((d, i) => {
                const x = startX + i * spacing;

                const openY = ((d.open - midVal) / range) * 180 * scaleFactor;
                const closeY = ((d.close - midVal) / range) * 180 * scaleFactor;
                const highY = ((d.high - midVal) / range) * 180 * scaleFactor;
                const lowY = ((d.low - midVal) / range) * 180 * scaleFactor;

                const isUp = d.close >= d.open;
                const color = isUp ? colorUp : colorDown;

                // Body (box)
                const bodyHeight = Math.abs(closeY - openY);
                const bodyMid = (openY + closeY) / 2;
                const bodyGeo = new THREE.BoxGeometry(4, Math.max(bodyHeight, 1.5), 4);
                const bodyMat = new THREE.MeshStandardMaterial({ 
                    color: color,
                    metalness: 0.6,
                    roughness: 0.3,
                    emissive: color,
                    emissiveIntensity: 0.2
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.set(x, bodyMid, 0);
                body.castShadow = true;
                body.receiveShadow = true;
                candleGroup.add(body);

                // Wick (Sumbu Lilin)
                const wickHeight = highY - lowY;
                const wickGeo = new THREE.BoxGeometry(1, wickHeight, 1);
                const wickMat = new THREE.MeshStandardMaterial({ 
                    color: color,
                    metalness: 0.8,
                    roughness: 0.2
                });
                const wick = new THREE.Mesh(wickGeo, wickMat);
                wick.position.set(x, (highY + lowY) / 2, 0);
                candleGroup.add(wick);

                // Glow Ring Effect
                const glowGeo = new THREE.BoxGeometry(4.8, Math.max(bodyHeight, 1.5) + 1, 4.8);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.08
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.set(x, bodyMid, 0);
                candleGroup.add(glow);
            });

            scene.add(candleGroup);

            // Grid Lantai
            const gridHelper = new THREE.GridHelper(600, 30, 0x444444, 0x222222);
            gridHelper.position.y = -110;
            scene.add(gridHelper);

            // Efek Partikel Latar Belakang
            const particlesGeo = new THREE.BufferGeometry();
            const particleCount = 150;
            const posArray = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 800;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({
                size: 2,
                color: 0x00d4ff,
                transparent: true,
                opacity: 0.5
            });
            const particles = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particles);

            // Simpan Referensi untuk manipulasi ukuran dan rotasi
            scenes[containerId] = {
                scene, camera, renderer, controls, candleGroup, particles
            };

            let interactionTimeout;
            isInteracting[containerId] = false;

            controls.addEventListener('start', () => {
                isInteracting[containerId] = true;
                clearTimeout(interactionTimeout);
            });

            controls.addEventListener('end', () => {
                interactionTimeout = setTimeout(() => {
                    isInteracting[containerId] = false;
                }, 3000);
            });

            // Animasi Putar Otomatis
            function animate() {
                animationIds[containerId] = requestAnimationFrame(animate);

                if (!isInteracting[containerId]) {
                    candleGroup.rotation.y += 0.003;
                }

                particles.rotation.y += 0.0008;
                particles.rotation.x += 0.0003;

                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // Atasi perubahan ukuran layar
            window.addEventListener('resize', () => {
                const newWidth = container.clientWidth;
                const newHeight = container.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            });
        }

            if (scenes[containerId]) {

                window.dispatchEvent(new Event('resize'));
            }, 100);
